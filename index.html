<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Learning — Learn • Practice • Speak</title>

  <!-- Private app: authentication now lives on its own page (login.html) -->
  <script>
    if (!localStorage.getItem('baamboozle_user')) {
      window.location.replace('login.html');
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN + shared configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>

  <!-- FontAwesome 6 for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <!-- Shared stylesheet (extracted from the former monolithic index.html) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="select-none antialiased">

  <!-- HTML partials are injected here by js/loader.js before the app engine starts -->
  <div id="appHeader"></div>

  <main class="max-w-6xl mx-auto px-4">
    <div id="appDashboard"></div>
    <div id="appQuiz"></div>
    <div id="appResults"></div>
  </main>

  <div id="appModals"></div>

  <script src="js/loader.js"></script>
</body>
</html>
