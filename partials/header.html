  <header class="sticky top-0 z-40 bg-white border-b border-slate-100 px-4 sm:px-8 py-3 mb-6 shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      
      <!-- Left: Brand Logo & Tagline -->
      <div id="btnGoHome" class="flex items-center gap-3 cursor-pointer group select-none flex-shrink-0">
        <div class="w-11 h-11 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-lg shadow-md shadow-indigo-500/25 group-hover:scale-105 transition-all">
          <i class="fa-solid fa-book-open"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black font-display tracking-tight text-slate-900 group-hover:text-indigo-600 transition-colors leading-tight">
            English Learning
          </h1>
          <p class="text-[11px] font-medium text-slate-400 hidden sm:block leading-none mt-0.5">Learn a little. Grow every day.</p>
        </div>
      </div>

      <!-- Center: Segmented Navigation Control -->
      <nav class="hidden md:flex items-center bg-slate-100/80 rounded-2xl p-1.5 border border-slate-200/50">
        <button id="navTabDashboard" class="bg-white text-indigo-600 font-bold text-xs sm:text-sm px-5 py-2 rounded-xl shadow-xs transition-all cursor-pointer" data-i18n="nav.dashboard">
          Tableau de bord
        </button>
        <button id="navTabLessons" class="text-slate-500 hover:text-slate-900 font-semibold text-xs sm:text-sm px-5 py-2 rounded-xl hover:bg-white/50 transition-all cursor-pointer" data-i18n="nav.lessons">
          Mes leçons
        </button>
        <button id="navTabLeaderboard" class="text-slate-500 hover:text-slate-900 font-semibold text-xs sm:text-sm px-5 py-2 rounded-xl hover:bg-white/50 transition-all cursor-pointer" data-i18n="nav.leaderboard">
          Classement
        </button>
      </nav>

      <!-- Right: Language toggle + User XP & Profile -->
      <div id="userControls" class="flex items-center gap-2 sm:gap-3 flex-shrink-0">

        <!-- Language Toggle Button -->
        <button id="btnLangToggle" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 hover:bg-indigo-50 hover:border-indigo-200 text-slate-700 hover:text-indigo-700 text-xs font-black transition-all cursor-pointer border border-slate-200" title="Changer la langue / Switch language">
          <i class="fa-solid fa-globe text-xs"></i>
          <span id="langLabel">EN</span>
        </button>

        <!-- Vertical Divider -->
        <div class="h-6 w-px bg-slate-200 hidden sm:block"></div>

        <!-- User XP Pill -->
        <div id="headerScorePill" class="flex items-center gap-2 px-4 py-2 rounded-2xl bg-[#FEF7EC] border border-amber-200/70 text-amber-900 shadow-2xs cursor-pointer hover:bg-amber-100/60 transition-all" title="Voir le classement">
          <i class="fa-solid fa-bolt text-amber-500 text-sm"></i>
          <span id="currentUserScore" class="font-bold text-xs sm:text-sm text-[#8A5314]">4 950 XP</span>
        </div>

        <!-- Vertical Divider Line -->
        <div class="h-6 w-px bg-slate-200 hidden sm:block"></div>

        <!-- User Profile Pill with Synchronisé & Chevron -->
        <div id="userProfilePill" class="flex items-center gap-3 pl-1 pr-2 py-1 rounded-2xl hover:bg-slate-50 transition-all cursor-pointer group" title="Profil utilisateur & Paramètres">
          <div class="flex flex-col items-start leading-tight">
            <div class="flex items-center gap-1.5">
              <span id="currentUserName" class="text-sm font-black text-slate-900 max-w-[120px] truncate">MemeMaster</span>
              <span class="text-[9px] font-black uppercase px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700">PRO</span>
            </div>
            <div class="flex items-center gap-1.5 text-[11px] text-slate-400 font-medium mt-0.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 flex-shrink-0"></span>
              <span id="dbStatusText" data-i18n="header.synced">Synchronisé</span>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:translate-x-0.5 transition-transform ml-1"></i>
        </div>

        <!-- Hidden elements to preserve JS bindings -->
        <div id="dbStatusPill" class="hidden"></div>
        <button id="btnSoundToggle" class="hidden"><i id="soundIcon" class="fa-solid fa-volume-high"></i></button>
        <button id="btnOpenLeaderboard" class="hidden"></button>
        <button id="btnLogout" class="hidden"></button>

      </div>
    </div>
  </header>
